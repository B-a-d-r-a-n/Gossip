name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install ruff
      - name: Run ruff
        run: ruff check .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_app_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redpanda:
        image: vectorized/redpanda:v23.1.12
        ports:
          - 9092:9092
          - 8082:8082
        options: >-
          --health-cmd "curl -f http://localhost:8081 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
      - name: Wait for services
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && nc -z localhost 6379 && nc -z localhost 9092 && break || sleep 2
          done
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/chat_app_test
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: test-secret-min-32-characters-long
          ENCRYPTION_KEYS: ${{ secrets.TEST_ENCRYPTION_KEY || 'test-fernet-key-here-32-bytes!!' }}
          FRONTEND_URL: http://localhost:5173
          AI_BACKEND_URL: http://localhost:8001
        run: |
          alembic upgrade head
      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/chat_app_test
          REDIS_URL: redis://localhost:6379/0
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: test-secret-min-32-characters-long
          ENCRYPTION_KEYS: ${{ secrets.TEST_ENCRYPTION_KEY || 'test-fernet-key-here-32-bytes!!' }}
          FRONTEND_URL: http://localhost:5173
          AI_BACKEND_URL: http://localhost:8001
        run: pytest -q

  ai-backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install ruff
      - name: Run ruff
        run: ruff check .

  ai-backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio
      - name: Run tests
        run: pytest -q

  frontend-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build-only
